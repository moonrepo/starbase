[package]
name = "starbase_console"
version = "0.7.0"
edition = "2024"
license = "MIT"
description = "Console reporting layer."
repository = "https://github.com/moonrepo/starbase"
rust-version = "1.95.0"

[dependencies]
starbase_styles = { version = "0.6.10", path = "../styles" }
crossterm = { workspace = true, optional = true }
futures-util = { version = "0.3.34", optional = true }
iocraft = { workspace = true, optional = true, features = ["unstable-output-streams"] }
miette = { workspace = true, optional = true }
parking_lot = "0.13.0"
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
supports-unicode = { version = "3.0.0", optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
starbase_console = { path = ".", features = ["serde", "ui"] }
libc = { workspace = true }

[features]
default = []
miette = ["dep:miette"]
serde = ["crossterm/serde", "dep:serde", "dep:serde_json"]
ui = ["dep:crossterm", "dep:futures-util", "dep:iocraft", "dep:supports-unicode", "dep:tokio"]
