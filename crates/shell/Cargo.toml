[package]
name = "starbase_shell"
version = "0.13.0"
edition = "2024"
license = "MIT"
description = "Utilities for detecting shells and managing profile files."
repository = "https://github.com/moonrepo/starbase"
rust-version = "1.85.0"

[package.metadata.docs.rs]
all-features = true

[dependencies]
base64 = { workspace = true }
miette = { workspace = true, optional = true }
regex = { workspace = true }
shell-quote = { version = "0.8.0", default-features = false, features = [
	"bash",
	"fish",
	"sh",
] }
thiserror = { workspace = true }
tracing = { workspace = true }

[target."cfg(windows)".dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = [
	"system",
] }

[dev-dependencies]
starbase_sandbox = { path = "../sandbox" }
serial_test = { workspace = true }

# Interactive E2E tests drive a real shell through a pty
[target."cfg(unix)".dev-dependencies]
libc = "0.2"

[features]
default = []
miette = ["dep:miette"]
