[package]
name = "starbase_process"
version = "0.4.1"
edition = "2024"
license = "MIT"
description = "Process utilities."
repository = "https://github.com/moonrepo/starbase"
rust-version = "1.95.0"

[dependencies]
starbase_console = { version = "0.7.1", path = "../console" }
starbase_shell = { version = "0.14.5", path = "../shell" }
starbase_styles = { version = "0.6.10", path = "../styles" }
bytes = { workspace = true }
miette = { workspace = true }
parking_lot = { workspace = true }
process-wrap = { version = "10.0.1", default-features = false, features = [
	"job-object",
	"process-group",
	"tokio1",
] }
rustc-hash = { workspace = true }
scc = { workspace = true }
serde = { workspace = true }
system_env = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = [
	"io-util",
	"macros",
	"process",
	"rt",
	"rt-multi-thread",
	"signal",
	"sync",
	"time",
] }

[dev-dependencies]
starbase_console = { path = "../console" }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
	# "Win32_System_Console",
	"Win32_System_Threading",
] }
