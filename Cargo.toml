[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.6", default-features = false, features = [
    "derive",
    "std",
] }
compact_str = "0.10.0"
crossterm = "0.29.0"
dirs = "6.0.0"
hex = "0.4.3"
iocraft = "0.8.4"
# iocraft = { git = "https://github.com/ccbrown/iocraft", branch = "main" }
libc = "0.2.189"
miette = "7.6.0"
regex = { version = "1.13.1", default-features = false }
relative-path = "2.0.1"
reqwest = { version = "0.13.4", default-features = false }
rustc-hash = "2.1.3"
scc = "3.8.6"
schematic = { version = "0.19.6", default-features = false }
serial_test = "4.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = [
    "io-util",
    "macros",
    "rt",
    "sync",
] }
tracing = { version = "0.1.44" }
windows-sys = { version = "0.61.2", default-features = false }
